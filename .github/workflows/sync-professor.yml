name: Sync professor repo

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Get and merge professor updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add professor https://github.com/graziasveva/innovation-management-datascience26.git
          git fetch professor HEAD
          git merge --no-edit FETCH_HEAD
          git push origin HEAD
